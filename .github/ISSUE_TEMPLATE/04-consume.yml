name: 领用或消耗
description: 每次食品、饮料或耗材领用都需要提交
title: "[consume] "
body:
  - type: textarea
    id: items
    attributes:
      label: 物资与批次清单
      description: 每行填写 BAT 编号、名称、数量、单位；不能确认编号时说明实物及位置。
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 用途与领用人
      description: 说明用途、实际领用人 GitHub 用户名及活动 Issue（如有）。
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: 预计或实际领取时间
      placeholder: YYYY-MM-DD HH:mm，默认北京时间
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 领取位置
      description: LOC 编号或明确定位说明。
    validations:
      required: true
  - type: dropdown
    id: timing
    attributes:
      label: 登记时机
      options: [领取前申请, 特殊情况补登记]
    validations:
      required: true
  - type: textarea
    id: exception
    attributes:
      label: 补登记说明
      description: 补登记填写原因、实际数量和知情管理员。
  - type: input
    id: contact
    attributes:
      label: 私有联系人记录
      description: 只贴已有私有联系人链接；需要协助时说明，不公开手机号。
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我是 SDC 成员；数量与单位明确，正文和附件不含敏感个人信息。
          required: true
